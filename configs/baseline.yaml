# Baseline: 4 layers / 4 heads / 256 dim / 256 context.
run_name: baseline
seed: 1337
data:
  data_dir: data
  tokenizer: data/tokenizer.json
model:
  n_layer: 4
  n_head: 4
  n_embd: 256
  block_size: 256
  dropout: 0.1
  bias: true
train:
  device: auto
  precision: fp32
  batch_size: 8
  grad_accum_steps: 4     # effective batch = 32 sequences = 8192 tokens
  max_steps: 5000
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 200
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  eval_interval: 250
  eval_batches: 50
  log_interval: 20
  ckpt_interval: 1000
  num_workers: 0
