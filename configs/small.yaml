# Target model from the plan: 6 layers / 6 heads / 384 dim / 256 context (~15M params with 8K vocab).
run_name: small
seed: 1337
data:
  data_dir: data/full      # all 1,772,187 cleaned stories (tokenizer stays data/tokenizer.json)
  tokenizer: data/tokenizer.json
model:
  n_layer: 6
  n_head: 6
  n_embd: 384
  block_size: 256
  dropout: 0.1
  bias: true
train:
  device: auto
  precision: fp32
  batch_size: 8
  grad_accum_steps: 8     # effective batch = 64 sequences = 16384 tokens
  max_steps: 10000
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 500
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  eval_interval: 500
  eval_batches: 100
  log_interval: 50
  ckpt_interval: 1000
  num_workers: 0
